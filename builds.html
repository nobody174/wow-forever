<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Builds — WoW Forever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1428; --panel:#161E38; --edge:#3A4468; --gold:#FFD100;
  --text:#E6E2D6; --muted:#9AA0B8; --accent:#FFD100;
  --serif:"Marcellus","Palatino Linotype",Georgia,serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans)}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--edge)}
.topbar .site-title{font:400 20px/1.1 var(--serif);color:var(--gold);text-decoration:none;letter-spacing:.01em;justify-self:start}
.topbar nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;justify-self:center}
@media (max-width:820px){
  .topbar{grid-template-columns:1fr;justify-items:center;text-align:center}
  .topbar .site-title{justify-self:center}
}
.topbar nav a{
  font:600 13px/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;
  color:var(--gold);text-decoration:none;padding:10px 16px;border-radius:6px;
  background:linear-gradient(180deg,#2A335A 0%,#161E38 55%,#10152C 100%);
  border:1px solid var(--edge);border-top-color:#4A5688;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 2px 4px rgba(0,0,0,.35);
  transition:transform .08s ease, box-shadow .08s ease, border-color .08s ease;
}
.topbar nav a:hover{
  border-color:var(--gold);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 0 10px rgba(255,209,0,.35), 0 2px 4px rgba(0,0,0,.35);
  transform:translateY(-1px);
}
.topbar nav a:active{transform:translateY(0);box-shadow:inset 0 1px 4px rgba(0,0,0,.5)}
.topbar nav a[aria-current="page"]{
  color:#0E1428;background:linear-gradient(180deg,#FFE566 0%,var(--gold) 55%,#C79C00 100%);
  border-color:#FFE566;box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 0 10px rgba(255,209,0,.5);
}
@media (prefers-reduced-motion:reduce){.topbar nav a{transition:none}}
.wrap{max-width:1100px;margin:0 auto;padding:60px 20px 80px;text-align:center}
h1{font:400 clamp(28px,5vw,44px)/1.1 var(--serif);color:var(--gold);margin:0 0 12px;letter-spacing:.01em}
p.lede{color:var(--muted);max-width:56ch;margin:0 auto}

.roster{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:32px 0 8px}
.roster button{
  display:flex;align-items:center;gap:8px;font:600 14px/1 var(--sans);
  text-transform:uppercase;letter-spacing:.03em;color:var(--c);
  background:linear-gradient(180deg,#2A335A 0%,#161E38 55%,#10152C 100%);
  border:1px solid var(--edge);border-top-color:#4A5688;border-radius:6px;
  padding:9px 16px 9px 10px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 2px 4px rgba(0,0,0,.35);
  transition:transform .08s ease, box-shadow .08s ease, border-color .08s ease;
}
.roster button:hover{
  border-color:var(--c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 0 10px color-mix(in srgb, var(--c) 45%, transparent), 0 2px 4px rgba(0,0,0,.35);
  transform:translateY(-1px);
}
.roster button:active{transform:translateY(0);box-shadow:inset 0 1px 4px rgba(0,0,0,.5)}
.roster button[aria-pressed="true"]{
  color:#0E1428;background:linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, white) 0%, var(--c) 55%, color-mix(in srgb, var(--c) 70%, black) 100%);
  border-color:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 0 10px color-mix(in srgb, var(--c) 55%, transparent);
}
.roster button .class-icon{flex:none;width:26px;height:26px;border-radius:5px;border:1px solid rgba(0,0,0,.3);object-fit:cover}
@media (prefers-reduced-motion:reduce){.roster button{transition:none}}
.specs{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:0 0 8px}
.specs button{
  font:600 13px/1 var(--sans);text-transform:uppercase;letter-spacing:.03em;
  background:linear-gradient(180deg,#2A335A 0%,#161E38 55%,#10152C 100%);
  border:1px solid var(--edge);border-top-color:#4A5688;color:var(--muted);
  padding:8px 14px;border-radius:999px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 2px 4px rgba(0,0,0,.35);
  transition:border-color .1s ease, color .1s ease;
}
.specs button:hover{border-color:var(--gold);color:var(--text)}
.specs button[aria-pressed="true"]{
  color:#0E1428;background:linear-gradient(180deg,#FFE566 0%,var(--gold) 55%,#C79C00 100%);
  border-color:#FFE566;box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 0 10px rgba(255,209,0,.5);
}
.specs button[aria-pressed="true"]{color:var(--text);border-color:var(--accent)}
.empty-hint{color:var(--muted);font-size:14px;margin:36px 0}

.builds-grid{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:stretch;
  gap:24px;
  margin-top:36px;
  text-align:left;
}
.build-section{
  background:var(--panel);
  border:1px solid var(--edge);
  border-left:3px solid var(--accent);
  border-radius:6px;
  padding:20px 22px;
  flex:1 1 420px;
  max-width:480px;
  display:flex;
  flex-direction:column;
}
.rotation .r-note{max-width:60ch}
h2{font:400 21px/1.2 var(--serif);color:var(--accent);margin:0 0 4px;letter-spacing:.01em}
.build-meta{color:var(--muted);font-size:14px;margin:0 0 18px}
.talent-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.talent-row .arrow{color:var(--gold);font-size:22px;font-weight:700;flex:none}
.talent-row .loop{color:var(--gold);font-size:20px;font-weight:700;flex:none;line-height:1}
.talent{
  position:relative;
  flex:none;
  width:52px;
  height:52px;
  border-radius:6px;
  border:2px solid var(--edge);
  cursor:default;
}
.talent img{width:100%;height:100%;object-fit:cover;display:block;border-radius:4px}
.talent .rank{
  position:absolute;
  right:2px;
  bottom:1px;
  font:700 11px/1 var(--sans);
  color:#fff;
  text-shadow:0 1px 2px #000, 0 0 3px #000;
}
.talent .tooltip{
  visibility:hidden;
  opacity:0;
  position:absolute;
  left:50%;
  bottom:calc(100% + 10px);
  transform:translateX(-50%);
  width:220px;
  background:#0A0F1F;
  border:1px solid var(--gold);
  border-radius:6px;
  padding:10px 12px;
  z-index:10;
  transition:opacity .12s ease;
  pointer-events:none;
  text-align:left;
}
.talent:hover .tooltip, .talent:focus-visible .tooltip{visibility:visible;opacity:1}
.talent .tooltip .t-name{color:var(--gold);font-weight:600;font-size:14px;margin:0 0 4px}
.talent .tooltip .t-rank{color:var(--muted);font-size:12px;margin:0 0 6px}
.talent .tooltip .t-desc{color:var(--text);font-size:13px;line-height:1.4;margin:0}
@media (max-width:480px){
  .talent{width:44px;height:44px}
}

.rotation{margin-top:22px;padding-top:18px;border-top:1px solid var(--edge)}
.rotation h3{font:600 13px/1 var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 4px}
.rotation .r-note{color:var(--muted);font-size:12.5px;margin:0 0 10px;line-height:1.4}
.rotation .r-block{margin-bottom:16px}
.rotation .r-block:last-child{margin-bottom:0}
.rotation .r-label{font:600 12px/1 var(--sans);color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
.rotation .confidence{display:inline-block;font:600 10px/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:3px;margin-left:8px;vertical-align:2px}
.confidence.high{color:#6FCF7F;border:1px solid rgba(111,207,127,.5)}
.confidence.medium{color:#E8A33D;border:1px solid rgba(232,163,61,.5)}
</style>
</head>

<div class="wrap">
  <h1>Builds</h1>
  <p class="lede">Talent builds and level-20 rotations for WoW Forever, added as we level up. Pick a class to see its build(s).</p>

  <nav class="roster" id="roster" aria-label="Class"></nav>
  <nav class="specs" id="specs" aria-label="Spec"></nav>
  <p class="empty-hint" id="empty-hint" hidden>Pick a class above to see its build.</p>
  <main class="builds-grid" id="out"></main>
</div>
<script>
const CLASS_ICONS = {
  Priest: "https://wow.zamimg.com/images/wow/icons/large/classicon_priest.jpg",
  Warlock: "https://wow.zamimg.com/images/wow/icons/large/classicon_warlock.jpg",
  Mage: "https://wow.zamimg.com/images/wow/icons/large/classicon_mage.jpg",
  Rogue: "https://wow.zamimg.com/images/wow/icons/large/classicon_rogue.jpg",
  Shaman: "https://wow.zamimg.com/images/wow/icons/large/classicon_shaman.jpg",
  Hunter: "https://wow.zamimg.com/images/wow/icons/large/classicon_hunter.jpg",
  Paladin: "https://wow.zamimg.com/images/wow/icons/large/classicon_paladin.jpg",
  Warrior: "https://wow.zamimg.com/images/wow/icons/large/classicon_warrior.jpg",
};
// Armor-type order, matching macros.html's roster: Cloth -> Leather -> Mail -> Plate.
const ROSTER = ["Priest","Warlock","Mage","Rogue","Shaman","Hunter","Paladin","Warrior"];
const CLASS_COLOR = {
  Priest:"#E6E2D6", Warlock:"#9482C9", Mage:"#69CCF0", Rogue:"#FFF569",
  Shaman:"#2459FF", Hunter:"#ABD473", Paladin:"#F58CBA", Warrior:"#C79C6E",
};

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const ICON = "https://wow.zamimg.com/images/wow/icons/medium/";

function talentHTML(t){
  return `<div class="talent" tabindex="0">
    <img src="${ICON}${t.icon}.jpg" alt="${esc(t.name)}">
    <span class="rank">${t.rank}</span>
    <div class="tooltip">
      <p class="t-name">${esc(t.name)}</p>
      <p class="t-rank">Rank ${t.rank}</p>
      <p class="t-desc">${esc(t.desc)}</p>
    </div>
  </div>`;
}
function talentRowHTML(talents){
  return `<div class="talent-row">` + talents.map((t,i)=>
    (i>0 ? `<span class="arrow">&rarr;</span>` : "") + talentHTML(t)
  ).join("") + `</div>`;
}
function abilityHTML(a){
  return `<div class="talent" tabindex="0">
    <img src="${ICON}${a.icon}.jpg" alt="${esc(a.name)}">
    <div class="tooltip">
      <p class="t-name">${esc(a.name)}</p>
      <p class="t-desc">${esc(a.note||"")}</p>
    </div>
  </div>`;
}
function abilityRowHTML(abilities, loop){
  let html = `<div class="talent-row">` + abilities.map((a,i)=>
    (i>0 ? `<span class="arrow">&rarr;</span>` : "") + abilityHTML(a)
  ).join("");
  if(loop) html += `<span class="loop" title="Repeat">&#8635;</span>`;
  return html + `</div>`;
}
function rotationHTML(r){
  if(!r) return "";
  let html = `<div class="rotation"><h3>Rotation<span class="confidence ${r.confidence}">${r.confidence}</span></h3>`;
  if(r.note) html += `<p class="r-note">${esc(r.note)}</p>`;
  if(r.single){
    html += `<div class="r-block"><p class="r-label">${r.singleLabel||"Single target"}</p>${abilityRowHTML(r.single, r.singleLoop)}</div>`;
  }
  if(r.aoe){
    html += `<div class="r-block"><p class="r-label">AoE</p>${abilityRowHTML(r.aoe, r.aoeLoop)}</div>`;
  }
  if(r.aoeNote) html += `<p class="r-note">${esc(r.aoeNote)}</p>`;
  return html + `</div>`;
}
function buildHTML(b){
  return `<div class="build-section">
    <h2>${esc(b.title)}</h2>
    <p class="build-meta">Hover an icon for details.</p>
    ${talentRowHTML(b.talents)}
    ${rotationHTML(b.rotation)}
  </div>`;
}

const roster = document.getElementById("roster");
const specs = document.getElementById("specs");
const out = document.getElementById("out");
const emptyHint = document.getElementById("empty-hint");
let cls = null;
let spec = "All";

function renderRoster(){
  roster.innerHTML = ROSTER.map(name=>{
    const icon = CLASS_ICONS[name];
    return `<button style="--c:${CLASS_COLOR[name]}" aria-pressed="${name===cls}" data-c="${name}"><img class="class-icon" src="${icon}" alt="" loading="lazy">${esc(name)}</button>`;
  }).join("");
}
function renderSpecs(builds){
  if(!builds || builds.length < 2){ specs.innerHTML = ""; return; }
  const opts = ["All", ...builds.map(b=>b.spec)];
  specs.innerHTML = opts.map(s=>`<button aria-pressed="${s===spec}" data-s="${s}">${esc(s)}</button>`).join("");
}
function render(){
  renderRoster();
  if(!cls){
    out.innerHTML = "";
    specs.innerHTML = "";
    emptyHint.hidden = false;
    return;
  }
  emptyHint.hidden = true;
  const builds = DATA[cls]||[];
  renderSpecs(builds);
  const shown = spec==="All" ? builds : builds.filter(b=>b.spec===spec);
  out.innerHTML = shown.map(buildHTML).join("");
}
roster.addEventListener("click", e=>{
  const b = e.target.closest("button");
  if(!b) return;
  cls = b.dataset.c === cls ? null : b.dataset.c;
  spec = "All";
  render();
});
specs.addEventListener("click", e=>{
  const b = e.target.closest("button");
  if(!b) return;
  spec = b.dataset.s;
  render();
});

// Restore last-picked class from the URL (?class=) or default to none selected.
try{
  const q = new URL(location.href).searchParams.get("class");
  if(q && ROSTER.includes(q)) cls = q;
}catch(e){ /* ignore */ }
render();
</script>
