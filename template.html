<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WoW Forever Macros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1428; --panel:#161E38; --edge:#3A4468; --gold:#FFD100;
  --text:#E6E2D6; --muted:#9AA0B8; --accent:#FFD100;
  --serif:"Marcellus","Palatino Linotype",Georgia,serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans)}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 20px;background:var(--panel);border-bottom:1px solid var(--edge)}
.topbar .site-title{font:400 20px/1.1 var(--serif);color:var(--gold);text-decoration:none;letter-spacing:.01em;justify-self:start}
.topbar nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;justify-self:center}
@media (max-width:820px){
  .topbar{grid-template-columns:1fr;justify-items:center;text-align:center}
  .topbar .site-title{justify-self:center}
}
.topbar nav a{
  font:600 13px/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;
  color:var(--gold);text-decoration:none;padding:10px 16px;border-radius:6px;
  background:linear-gradient(180deg,#2A335A 0%,#161E38 55%,#10152C 100%);
  border:1px solid var(--edge);border-top-color:#4A5688;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 2px 4px rgba(0,0,0,.35);
  transition:transform .08s ease, box-shadow .08s ease, border-color .08s ease;
}
.topbar nav a:hover{
  border-color:var(--gold);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 0 10px rgba(255,209,0,.35), 0 2px 4px rgba(0,0,0,.35);
  transform:translateY(-1px);
}
.topbar nav a:active{transform:translateY(0);box-shadow:inset 0 1px 4px rgba(0,0,0,.5)}
.topbar nav a[aria-current="page"]{
  color:#0E1428;background:linear-gradient(180deg,#FFE566 0%,var(--gold) 55%,#C79C00 100%);
  border-color:#FFE566;box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 0 10px rgba(255,209,0,.5);
}
@media (prefers-reduced-motion:reduce){.topbar nav a{transition:none}}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 80px}
h1{font:400 clamp(28px,5vw,44px)/1.1 var(--serif);color:var(--gold);margin:0 0 6px;letter-spacing:.01em}
.lede{color:var(--muted);margin:0 0 22px;max-width:62ch}
.lede .md-link{color:var(--gold);text-decoration:underline}
.lede .md-link:hover{color:var(--accent)}
.search-bar{position:sticky;top:57px;z-index:10;background:var(--bg);padding:10px 0;margin:0 0 4px}
.search{width:100%;padding:12px 14px;background:var(--panel);border:1px solid var(--edge);border-radius:6px;color:var(--text);font:16px var(--sans)}
.search:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.roster{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 10px}
.roster button{
  display:flex;align-items:center;gap:8px;font:600 14px/1 var(--sans);
  text-transform:uppercase;letter-spacing:.03em;color:var(--c);
  background:linear-gradient(180deg,#2A335A 0%,#161E38 55%,#10152C 100%);
  border:1px solid var(--edge);border-top-color:#4A5688;border-radius:6px;
  padding:9px 16px 9px 10px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 2px 4px rgba(0,0,0,.35);
  transition:transform .08s ease, box-shadow .08s ease, border-color .08s ease;
}
.roster button:hover{
  border-color:var(--c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 0 10px color-mix(in srgb, var(--c) 45%, transparent), 0 2px 4px rgba(0,0,0,.35);
  transform:translateY(-1px);
}
.roster button:active{transform:translateY(0);box-shadow:inset 0 1px 4px rgba(0,0,0,.5)}
.roster button[aria-pressed="true"]{
  color:#0E1428;background:linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, white) 0%, var(--c) 55%, color-mix(in srgb, var(--c) 70%, black) 100%);
  border-color:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 0 10px color-mix(in srgb, var(--c) 55%, transparent);
}
.roster button .class-icon{flex:none;width:24px;height:24px;border-radius:4px;border:1px solid rgba(0,0,0,.3);object-fit:cover}
@media (prefers-reduced-motion:reduce){.roster button{transition:none}}
.specs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:26px}
.specs button{font:500 14px var(--sans);background:var(--panel);border:1px solid var(--edge);color:var(--muted);padding:5px 12px;border-radius:999px;cursor:pointer}
.specs button[aria-pressed="true"]{color:var(--text);border-color:var(--accent)}
h2{font:400 26px/1.2 var(--serif);color:var(--accent);margin:34px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--edge)}
details.section{margin:22px 0 10px}
details.section > summary{
  list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
  font:600 15px var(--sans);color:var(--gold);padding:2px 0;user-select:none;
}
details.section > summary::-webkit-details-marker{display:none}
details.section > summary .toggle{
  flex:none;width:18px;height:18px;border:1px solid var(--gold);border-radius:3px;
  display:flex;align-items:center;justify-content:center;font:600 13px/1 var(--mono);color:var(--gold);
}
details.section > summary .toggle::before{content:"+"}
details.section[open] > summary .toggle::before{content:"\2212"}
details.section .section-body{padding-top:8px}
details.patterns-wrap{margin:34px 0 4px}
details.patterns-wrap > summary{font:400 26px/1.2 var(--serif);color:var(--accent);padding-bottom:6px;border-bottom:1px solid var(--edge)}
details.patterns-wrap > summary .toggle{border-color:var(--accent);color:var(--accent)}
.macro{background:var(--panel);border:1px solid var(--edge);border-left:3px solid var(--accent);border-radius:5px;padding:10px 12px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.name{font-weight:600}
.note{color:var(--muted);font-size:14px;margin-top:2px}
pre{margin:8px 0 0;padding:8px 10px;background:#0A0F1F;border-radius:4px;overflow-x:auto;font:14px/1.5 var(--mono);color:#CFE3FF;white-space:pre}
.copy{flex:none;font:500 13px var(--sans);background:transparent;border:1px solid var(--edge);color:var(--text);padding:4px 12px;border-radius:4px;cursor:pointer}
.copy:hover{border-color:var(--accent)}
.copy.done{color:#0E1428;background:var(--gold);border-color:var(--gold)}
.empty{color:var(--muted);padding:20px 0}
.patterns{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:10px;margin-bottom:10px}
.patterns pre{white-space:pre-wrap;word-break:break-word;overflow-x:visible}
.tabgroup{margin:22px 0 10px}
.tabgroup .tabgroup-head{font:600 15px var(--sans);color:var(--gold);margin:0 0 10px}
.tabgroup .picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tabgroup .picker button{
  font:500 14px var(--sans);color:var(--muted);background:var(--panel);
  border:1px solid var(--edge);border-radius:999px;padding:8px 16px;cursor:pointer;
  transition:border-color .12s ease,color .12s ease,box-shadow .12s ease;
}
.tabgroup .picker button:hover{border-color:var(--accent);color:var(--text)}
.tabgroup .picker button[aria-pressed="true"]{
  color:#0E1428;background:linear-gradient(180deg,#FFE566 0%,var(--gold) 55%,#C79C00 100%);
  border-color:#FFE566;box-shadow:0 0 10px rgba(255,209,0,.35);font-weight:600;
}
.tabgroup .panel{
  background:var(--panel);border:1px solid var(--edge);border-left:3px solid var(--accent);
  border-radius:6px;padding:14px 16px;
}
.tabgroup .panel .note{color:var(--muted);font-size:14px;margin:0 0 8px}
.tabgroup .panel pre{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="topbar">
  <a class="site-title" href="index.html">Road to Forever</a>
  <nav aria-label="Site">
    <a href="macros.html" __PAGE_MACROS__>Macros</a>
    <a href="builds.html" __PAGE_BUILDS__>Builds</a>
    <a href="addons.html" __PAGE_ADDONS__>Addons</a>
    <a href="launch-plan.html" __PAGE_LAUNCH__>Launch Plan</a>
    <a href="talents.html">Talent Calc</a>
  </nav>
</div>
<div class="wrap">
  <h1>WoW Forever macros</h1>
  <p class="lede">Short damage and mouseover-first support macros. Pick a class, filter by spec, and copy straight into the macro window. Prefer plain text? <a class="md-link" href="wow-forever-macros.md">Read the full list as markdown</a>.</p>
  <div class="search-bar">
    <input class="search" id="q" type="search" placeholder="Search every class: spell, macro type or keyword" aria-label="Search macros">
  </div>
  <nav class="roster" id="roster" aria-label="Class"></nav>
  <nav class="specs" id="specs" aria-label="Spec"></nav>
  <main id="out"></main>
</div>
<script>
const D = __DATA__;
const ALL = [D.universal, ...D.classes];
let cls = D.classes[0].name, spec = "All";
let tabGroups = []; // per-render lookup: tabGroups[groupIndex] = that group's macro list, for the tabbed picker

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const byOrder = gs => [...gs].sort((a,b)=>D.order.indexOf(a.type)-D.order.indexOf(b.type));

function macroHTML(m){
  if(!m.code) return `<div class="macro"><div class="note">${esc(m.note)}</div></div>`;
  return `<div class="macro"><div class="top"><div><div class="name">${esc(m.name)}</div>${m.note?`<div class="note">${esc(m.note)}</div>`:""}</div>
  <button class="copy" data-code="${esc(m.code)}">Copy</button></div><pre>${esc(m.code)}</pre></div>`;
}

function groupHTML(g){
  return `<details class="section"><summary><span class="toggle" aria-hidden="true"></span>${esc(g.type)}</summary><div class="section-body">${g.macros.map(macroHTML).join("")}</div></details>`;
}

// Tabbed picker: one pill per macro in the group, click swaps the code panel below.
// Used for classes flagged {"tabbed": true} in data.py (Warcraft Tavern-style layout).
function tabGroupHTML(g, gi){
  const named = g.macros.filter(m=>m.code);
  if(!named.length) return groupHTML(g); // fall back for note-only groups
  const active = 0;
  const pills = named.map((m,i)=>`<button aria-pressed="${i===active}" data-gi="${gi}" data-mi="${i}">${esc(m.name)}</button>`).join("");
  return `<div class="tabgroup" data-gi="${gi}">
    <div class="tabgroup-head">${esc(g.type)}</div>
    <div class="picker">${pills}</div>
    <div class="panel">${tabPanelInner(named[active])}</div>
  </div>`;
}
function tabPanelInner(m){
  return `<div class="top"><div>${m.note?`<div class="note">${esc(m.note)}</div>`:""}</div>
  <button class="copy" data-code="${esc(m.code)}">Copy</button></div><pre>${esc(m.code)}</pre>`;
}

const CLASS_ICONS = {
  Priest: "https://wow.zamimg.com/images/wow/icons/large/classicon_priest.jpg",
  Shaman: "https://wow.zamimg.com/images/wow/icons/large/classicon_shaman.jpg",
  Paladin: "https://wow.zamimg.com/images/wow/icons/large/classicon_paladin.jpg",
  Warlock: "https://wow.zamimg.com/images/wow/icons/large/classicon_warlock.jpg",
  Hunter: "https://wow.zamimg.com/images/wow/icons/large/classicon_hunter.jpg",
  Warrior: "https://wow.zamimg.com/images/wow/icons/large/classicon_warrior.jpg",
  Rogue: "https://wow.zamimg.com/images/wow/icons/large/classicon_rogue.jpg",
  Mage: "https://wow.zamimg.com/images/wow/icons/large/classicon_mage.jpg",
  Universal: "assets/universal-icon.webp",
};
function renderRoster(){
  roster.innerHTML = ALL.map(c=>{
    const icon = CLASS_ICONS[c.name];
    const img = icon ? `<img class="class-icon" src="${icon}" alt="" loading="lazy">` : "";
    return `<button style="--c:${c.color}" aria-pressed="${c.name===cls}" data-c="${c.name}">${img}${esc(c.name)}</button>`;
  }).join("");
}
function renderSpecs(c){
  if(c.name==="Universal"){specs.innerHTML="";return;}
  const opts=["All",...c.sections.map(s=>s.spec)];
  specs.innerHTML = opts.map(s=>`<button aria-pressed="${s===spec}" data-s="${s}">${s==="Shared"||s==="General"?s+" (all specs)":s==="All"?"Everything":s}</button>`).join("");
}
function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  let html = "";
  if(q){
    document.documentElement.style.setProperty("--accent","#FFD100");
    roster.style.opacity=.5; specs.innerHTML="";
    for(const c of ALL) for(const s of c.sections) for(const g of s.groups){
      const hits = g.macros.filter(m=>(m.name+" "+m.code+" "+g.type+" "+c.name+" "+s.spec).toLowerCase().includes(q) && m.code);
      if(hits.length) html += groupHTML({type: `${c.name} · ${s.spec} — ${g.type}`, macros: hits});
    }
    out.innerHTML = html || `<p class="empty">No macro matches “${esc(q)}”. Try a spell name like Flash Heal or a type like focus.</p>`;
    return;
  }
  roster.style.opacity=1;
  const c = ALL.find(x=>x.name===cls);
  document.documentElement.style.setProperty("--accent", c.color);
  renderRoster(); renderSpecs(c);
  if(c.name==="Universal"){
    html += `<details class="section patterns-wrap"><summary><span class="toggle" aria-hidden="true"></span>Style patterns</summary><div class="section-body patterns">`+D.patterns.map(p=>macroHTML({name:p.name,code:p.code,note:""})).join("")+`</div></details>`;
  }
  let gi = 0;
  tabGroups = [];
  for(const s of c.sections){
    if(spec!=="All" && s.spec!==spec) continue;
    html += `<h2>${esc(c.name==="Universal"?"All classes":s.spec==="Shared"||s.spec==="General"?c.name+" — "+(s.spec==="General"?"General (every spec)":"shared by every spec"):c.name+" — "+s.spec)}</h2>`;
    for(const g of byOrder(s.groups)){ html += tabGroupHTML(g, gi); tabGroups[gi] = g.macros.filter(m=>m.code); gi++; }
  }
  out.innerHTML = html;
}
roster.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cls=b.dataset.c;spec="All";document.getElementById("q").value="";render();});
specs.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;spec=b.dataset.s;render();});
document.getElementById("q").addEventListener("input",render);
out.addEventListener("click",async e=>{
  const pill=e.target.closest(".tabgroup .picker button");
  if(pill){
    const gi=+pill.dataset.gi, mi=+pill.dataset.mi;
    const wrap=pill.closest(".tabgroup");
    wrap.querySelectorAll(".picker button").forEach(x=>x.setAttribute("aria-pressed", x===pill?"true":"false"));
    wrap.querySelector(".panel").innerHTML = tabPanelInner(tabGroups[gi][mi]);
    return;
  }
  const b=e.target.closest(".copy"); if(!b) return;
  try{await navigator.clipboard.writeText(b.dataset.code);}
  catch{const t=document.createElement("textarea");t.value=b.dataset.code;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();}
  b.textContent="Copied";b.classList.add("done");setTimeout(()=>{b.textContent="Copy";b.classList.remove("done")},1200);
});
renderRoster(); render();
</script>
</body>
</html>
